# G06 / Q04 / Q05 — do not npm publish from a laptop.

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect only (no upload). Leave OFF to publish.
        type: boolean
        default: false
      publish_free:
        description: Publish @dashflowx/datagrid to npmjs (public)
        type: boolean
        default: true
      publish_pro:
        description: Publish @dashflowx/datagrid-pro to GitHub Packages (private)
        type: boolean
        default: true
      dist_tag:
        description: npm dist-tag for the free package
        type: choice
        default: latest
        options: [latest, next]

concurrency:
  group: publish-npm-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  CORE_REPO: dashflowx/dashflowx-core

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: dashflow-datagrid
    steps:
      - name: Checkout datagrid
        uses: actions/checkout@v4
        with:
          path: dashflow-datagrid

      - name: Checkout sibling core for file peer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          path: dashflowx-core

      - id: flags
        name: Resolve publish flags
        working-directory: .
        run: |
          dry='${{ inputs.dry_run }}'
          free='${{ inputs.publish_free }}'
          pro='${{ inputs.publish_pro }}'
          echo "inputs dry_run=${dry} publish_free=${free} publish_pro=${pro}"
          if [ "$dry" = "true" ]; then
            echo "do_free=false" >> "$GITHUB_OUTPUT"
            echo "do_pro=false" >> "$GITHUB_OUTPUT"
            echo "inspect_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_free=$free" >> "$GITHUB_OUTPUT"
            echo "do_pro=$pro" >> "$GITHUB_OUTPUT"
            echo "inspect_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: dashflow-datagrid/yarn.lock

      - name: Install and build sibling @dashflowx/core
        working-directory: ${{ github.workspace }}/dashflowx-core
        run: |
          yarn install --frozen-lockfile
          yarn build

      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn lint
      - run: yarn build

      - name: First publish is 1.0.0 if the package is missing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ensure-publish-version.mjs . https://registry.npmjs.org
          umask 077
          cat > "$RUNNER_TEMP/github.npmrc" <<EOF
          @dashflowx:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/github.npmrc" \
            node scripts/ensure-publish-version.mjs datagrid-pro https://npm.pkg.github.com

      - name: Inspect free tarball (no src/pro)
        run: node scripts/pack-inspect.mjs .

      - name: Inspect pro tarball
        run: node scripts/pack-inspect.mjs datagrid-pro

      - name: Inspect only (not uploading)
        if: steps.flags.outputs.inspect_only == 'true'
        run: echo "inspect only — not uploading"

      - name: Require NPM_TOKEN for free publish
        if: steps.flags.outputs.do_free == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Set repository secret NPM_TOKEN (npmjs granular token with bypass 2FA) for the @dashflowx scope."
            exit 1
          fi

      - name: Publish @dashflowx/datagrid to npmjs
        if: steps.flags.outputs.do_free == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/npmjs.npmrc" <<EOF
          @dashflowx:registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          registry=https://registry.npmjs.org/
          always-auth=true
          EOF
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmjs.npmrc" \
            node scripts/ensure-publish-version.mjs . https://registry.npmjs.org
          VER="$(node -p "require('./package.json').version")"
          echo "Publishing @dashflowx/datagrid@${VER} to https://registry.npmjs.org"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmjs.npmrc" \
            node scripts/publish-npmjs.mjs "${{ inputs.dist_tag }}"

      - name: Publish @dashflowx/datagrid-pro to GitHub Packages
        if: steps.flags.outputs.do_pro == 'true'
        working-directory: dashflow-datagrid/datagrid-pro
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/github.npmrc" <<EOF
          @dashflowx:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          echo "Publishing @dashflowx/datagrid-pro to https://npm.pkg.github.com"
          npm publish --userconfig "$RUNNER_TEMP/github.npmrc" --ignore-scripts

      - name: Verify free package on npmjs
        if: ${{ success() && steps.flags.outputs.do_free == 'true' }}
        run: npm view @dashflowx/datagrid version --registry https://registry.npmjs.org

      - name: Confirm Pro is not on public npmjs
        if: steps.flags.outputs.do_pro == 'true'
        run: |
          if npm view @dashflowx/datagrid-pro version >/dev/null 2>&1; then
            echo "::error::@dashflowx/datagrid-pro must not exist on registry.npmjs.org"
            exit 1
          fi
          echo "Pro is not listed on public npmjs (expected)."
